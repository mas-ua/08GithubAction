name: Java CI with Maven

# 1. Триггер на push и 2. Возможность ручного запуска
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-test:
    # 3. Выбор операционной системы
    runs-on: ubuntu-latest

    steps:
      # 5. Клонирование проекта
      - name: Checkout repository
        uses: actions/checkout@v4

      # 4. Установка ПО (Java)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      # 6. Скачивание зависимостей
      - name: Download dependencies
        run: mvn dependency:go-offline

      # 7. Сборка проекта
      - name: Build project
        run: mvn compile

      # 8. Запуск модульных тестов
      - name: Run unit tests
        run: mvn test
